# Configuration for PR labeler (v5+ format)
# Automatically labels PRs based on changed files

documentation:
  - changed-files:
    - any-glob-to-any-file: '**/*.md'
    - any-glob-to-any-file: 'docs/**/*'

dependencies:
  - changed-files:
    - any-glob-to-any-file: 'package.json'
    - any-glob-to-any-file: 'package-lock.json'
    - any-glob-to-any-file: 'yarn.lock'

configuration:
  - changed-files:
    - any-glob-to-any-file: 'vite.config.js'
    - any-glob-to-any-file: 'eslint.config.js'
    - any-glob-to-any-file: '**/*.env*'
    - any-glob-to-any-file: '.gitignore'

docker:
  - changed-files:
    - any-glob-to-any-file: 'Dockerfile'
    - any-glob-to-any-file: 'docker-compose.yml'
    - any-glob-to-any-file: 'nginx.conf'
    - any-glob-to-any-file: '.dockerignore'

ci-cd:
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'

components:
  - changed-files:
    - any-glob-to-any-file: 'src/**/*.jsx'
    - any-glob-to-any-file: 'src/**/*.js'

styling:
  - changed-files:
    - any-glob-to-any-file: 'src/**/*.css'
    - any-glob-to-any-file: 'src/**/*.scss'

assets:
  - changed-files:
    - any-glob-to-any-file: 'src/assets/**/*'
    - any-glob-to-any-file: 'public/**/*'

api:
  - changed-files:
    - any-glob-to-any-file: 'src/api.js'
    - any-glob-to-any-file: 'src/**/api/**/*'

authentication:
  - changed-files:
    - any-glob-to-any-file: 'src/Login.jsx'
    - any-glob-to-any-file: 'src/Register.jsx'
    - any-glob-to-any-file: 'src/AuthContext.jsx'

bugfix:
  - head-branch: ['^fix', 'fix\\/']

feature:
  - head-branch: ['^feat', 'feature\\/']
