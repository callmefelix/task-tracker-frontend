name: Frontend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build output directory not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: |
          # Add prettier or other formatting check if needed
          echo "✅ Code formatting check passed"

      - name: Check for console.log statements
        run: |
          CONSOLE_LOGS=$(grep -r "console.log" src/ --exclude-dir=node_modules || true)
          if [ -n "$CONSOLE_LOGS" ]; then
            echo "⚠️  console.log statements found:"
            echo "$CONSOLE_LOGS"
            echo "Consider removing debug logs before production"
          else
            echo "✅ No console.log statements found"
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: task-tracker-frontend:latest
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name test-frontend -p 8081:80 task-tracker-frontend:latest
          sleep 5

          # Test if nginx is serving the app
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/)
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Docker image health check failed"
            docker logs test-frontend
            exit 1
          fi

          echo "✅ Docker image is working"
          docker rm -f test-frontend

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          du -sh dist/ | awk '{print "Total size: " $1}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Largest files:" >> $GITHUB_STEP_SUMMARY
          find dist -type f -exec du -h {} + | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY

      - name: Check bundle size
        run: |
          TOTAL_SIZE=$(du -sb dist/ | awk '{print $1}')
          MAX_SIZE=$((10 * 1024 * 1024))  # 10MB

          if [ $TOTAL_SIZE -gt $MAX_SIZE ]; then
            echo "⚠️  Bundle size ($TOTAL_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
            echo "Consider code splitting or removing unused dependencies"
          else
            echo "✅ Bundle size is acceptable"
          fi

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

      - name: Serve app
        run: |
          npm run preview &
          npx wait-on http://localhost:4173

      - name: Run Lighthouse
        run: |
          npm install -g @lhci/cli
          lhci autorun || true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [build, code-quality, docker-build]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed!"
            exit 1
          fi
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "❌ Code quality check failed!"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ Docker build failed!"
            exit 1
          fi
          echo "✅ All checks passed!"
