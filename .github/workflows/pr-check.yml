name: PR Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest

    steps:
      - name: PR details
        run: |
          echo "PR #${{ github.event.pull_request.number }}"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Base: ${{ github.event.pull_request.base.ref }}"
          echo "Head: ${{ github.event.pull_request.head.ref }}"

  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?:.+ ]]; then
            echo "❌ PR title does not follow conventional commits format"
            echo "Expected format: type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, test, chore, perf"
            exit 1
          fi
          echo "✅ PR title follows conventional commits"

      - name: Check for large files
        run: |
          LARGE_FILES=$(find . -type f -size +5M -not -path "./.git/*" -not -path "./dist/*" -not -path "./node_modules/*")
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Large files detected (>5MB):"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "✅ No large files found"

      - name: Check commit messages
        run: |
          git log origin/${{ github.event.pull_request.base.ref }}..${{ github.event.pull_request.head.sha }} --pretty=format:"%s" | while read message; do
            if [[ ! "$message" =~ ^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?:.+ ]]; then
              echo "❌ Commit message does not follow conventional commits: $message"
              exit 1
            fi
          done
          echo "✅ All commit messages follow conventional commits"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build output directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Check for TODO comments
        run: |
          TODOS=$(grep -r "TODO\|FIXME\|XXX" src/ || true)
          if [ -n "$TODOS" ]; then
            echo "⚠️  TODO/FIXME comments found:"
            echo "$TODOS"
          else
            echo "✅ No TODO/FIXME comments found"
          fi

      - name: Check for console statements
        run: |
          CONSOLE_STATEMENTS=$(grep -r "console\." src/ | grep -v "console.error" || true)
          if [ -n "$CONSOLE_STATEMENTS" ]; then
            echo "⚠️  Console statements found (excluding console.error):"
            echo "$CONSOLE_STATEMENTS"
            echo "Consider removing debug logs before production"
          else
            echo "✅ No unwanted console statements found"
          fi

      - name: Check for debugger statements
        run: |
          DEBUGGER=$(grep -r "debugger" src/ || true)
          if [ -n "$DEBUGGER" ]; then
            echo "❌ Debugger statements found:"
            echo "$DEBUGGER"
            exit 1
          else
            echo "✅ No debugger statements found"
          fi

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Check for security vulnerabilities
        run: |
          npm audit --audit-level=moderate || echo "⚠️  Vulnerabilities found"

      - name: Check for outdated dependencies
        run: |
          npm outdated || echo "Some dependencies are outdated"

  changes-summary:
    name: Changes Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changes summary
        run: |
          echo "## Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Files Changed" >> $GITHUB_STEP_SUMMARY
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }} >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Files changed: $(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }} | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Lines added: $(git diff --shortstat origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }} | awk '{print $4}')" >> $GITHUB_STEP_SUMMARY
          echo "- Lines deleted: $(git diff --shortstat origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }} | awk '{print $6}')" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Component Changes" >> $GITHUB_STEP_SUMMARY
          COMPONENTS=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }} | grep "\.jsx\|\.js" || true)
          if [ -n "$COMPONENTS" ]; then
            echo "$COMPONENTS" >> $GITHUB_STEP_SUMMARY
          else
            echo "No component files changed" >> $GITHUB_STEP_SUMMARY
          fi

  pr-labeler:
    name: Auto Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label PR based on files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  final-check:
    name: PR Ready for Review
    runs-on: ubuntu-latest
    needs: [validate-pr, build-check, code-review]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.validate-pr.result }}" != "success" ] || \
             [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "❌ PR checks failed. Please fix the issues before requesting review."
            exit 1
          fi
          echo "✅ All PR checks passed! Ready for review."

      - name: Comment on PR
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All automated checks passed! This PR is ready for review.'
            })
